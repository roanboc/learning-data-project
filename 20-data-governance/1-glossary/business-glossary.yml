# The business glossary: what the university's words mean, each term with its owner, who decides it.
# At the university the glossary is a tool, Unity Catalog's Glossary on Databricks; this is it as text,
# so people and agents can read it beside the rest of governance's files. The data project keeps an
# export of the platform's copy (30-data-project/skills/sync-the-glossary/example_glossary.json), and
# its check fails if a term there differs from this file (30-data-project/scripts/check/from_governance.py).
#
# A term is decided here, by its owner, before any code. An entity the glossary has no term for says so
# in its conceptual model, with who confirmed the absence (no_glossary_term:), as the learner does.

glossary: the university's business glossary
terms:
- term: Award
  definition: A qualification the university confers, such as a graduate certificate or a master, for
    a set number of credit points. When it's conferred on a learner, it's a credential too.
  owner: Mei Tanaka, registrar's office
  updated_on: '2026-10-01'
- term: Casual hours contracted
  definition: 'What the casual teaching the contracts allow in a teaching period comes to: each casual
    contract''s hours, at the rate for each duty, counted by the contract''s teaching period. Planning''s
    measure, to plan the teaching.'
  owner: Clara Jensen, Planning
  updated_on: '2026-09-15'
- term: Casual pay paid
  definition: What casual staff are paid on each pay day, from the claims approved for it, before tax
    and on-costs, counted by the pay day that paid it. HR's measure, to check each pay run.
  owner: Ingrid Holm, HR
  updated_on: '2026-09-15'
- term: Casual teaching cost
  definition: 'What the casual teaching in a teaching period costs: the claims approved for casual staff
    for teaching, plus on-costs, what the university pays on top of their pay. Also called sessional teaching
    cost, or casual teaching spend.'
  owner: Rohan Desai, Finance
  updated_on: '2026-09-15'
- term: Commencing student
  definition: A student who started a course at the university for the first time in the year being counted.
    A student who comes back to a course they had already started, after leave or a break, isn't commencing.
  owner: Mei Tanaka, registrar's office
  updated_on: '2026-11-04'
- term: Unit offering
  definition: A unit taught in a semester, on campus, online or both.
  owner: Mei Tanaka, registrar's office
  updated_on: '2026-06-30'
